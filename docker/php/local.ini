; PM-OS PHP Configuration
upload_max_filesize = 50M
post_max_size = 50M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300

; OPcache
; NOTE: validate_timestamps must be 1 for local development — the app code is
; bind-mounted (.:/var/www), so with validate_timestamps=0 OPcache serves stale
; bytecode and ignores edited/pulled files until the container is restarted.
; For production, set validate_timestamps=0 (and deploy fresh images) instead.
opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Session
session.gc_maxlifetime = 7200

; Timezone
date.timezone = Asia/Riyadh

; Intl
intl.default_locale = ar_SA
